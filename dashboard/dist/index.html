<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payroll Layer public dashboard</title>
  </head>
  <body>
    <main>
      <h1>Payroll Layer public API</h1>
      <pre id="system">Loading public system status…</pre>
    </main>
    <script>
      fetch("/public/v1/system")
        .then((response) => response.json())
        .then((data) => { document.querySelector("#system").textContent = JSON.stringify(data, null, 2); })
        .catch((error) => { document.querySelector("#system").textContent = String(error); });
    </script>
  </body>
</html>
